function renderSetupTemplates() {
    $('setup-templates').innerHTML = TEMPLATES.map(tp => `
        <button class="cat-card" onclick="applyTemplate('${tp.key}', true); hideSetup();">
            <div class="text-xs font-semibold text-slate-800">${esc(t('tpl_' + tp.key))}</div>
            <div class="text-[11px] font-mono text-indigo-600">${esc(toDisp(tp.w))} × ${esc(toDisp(tp.h))}</div>
            <div class="text-[11px] text-slate-400">${esc(t('items', tp.furniture.length))}</div>
        </button>`).join('');
}

function applySetup() {
    const w = inputToCm($('setup-w').value), h = inputToCm($('setup-h').value);
    const wt = +$('setup-wt').value;
    const ch = inputToCm($('setup-ch').value);
    if (!(w >= 50 && w <= 5000 && h >= 50 && h <= 5000)) { toast(t('invalidSize')); return; }
    room = { name: $('setup-name').value.trim().slice(0, 80) || t('newRoom'), width: Math.round(w * 10) / 10, height: Math.round(h * 10) / 10, wallThickness: clamp(wt || 20, 5, 60), ceilingHeight: clamp(ch || 260, 100, 1000) };
    openings.forEach(clampOpening);
    furniture.forEach(clampItem);
    hideSetup();
    refreshAll(); markDirty();
    View3D.resetView();
}

function onTemplateSelect(selEl) {
    const key = selEl.value;
    selEl.value = '';
    if (key) applyTemplate(key, false);
}

function applyTemplate(key, skipConfirm) {
    const tp = TEMPLATES.find(x => x.key === key);
    if (!tp) return;
    if (!skipConfirm && (furniture.length || openings.length) && !confirm(t('confirmTemplate'))) return;
    room = { name: t('tpl_' + key), width: tp.w, height: tp.h, wallThickness: tp.wt, ceilingHeight: 260 };
    openings = tp.openings.map(o => normalizeOpening({ ...o }));
    furniture = tp.furniture.map(f => makeItem(CATALOG.find(c => c.id === f.id), f.x, f.y, f.rot));
    sel = null;
    refreshAll(); markDirty();
    View3D.resetView();
}

// ===== CATALOG =====
let catalogTab = 'bedroom';
function showCatalog(tab) {
    if (tab) catalogTab = tab;
    renderCatalog();
    $('catalog-modal').classList.remove('hidden');
}
function hideCatalog() { $('catalog-modal').classList.add('hidden'); }

function renderCatalog() {
    $('cat-tabs').innerHTML = [...CAT_KEYS, 'custom'].map(k =>
        `<button class="cat-tab ${k === catalogTab ? 'active' : ''}" onclick="catalogTab='${k}';renderCatalog()">${esc(t('cat_' + k))}</button>`).join('');
    const card = (def, name, deletable) => {
        const c = CAT_COLORS[def.cat] || CAT_COLORS.custom;
        return `<div class="cat-card" onclick="addFromCatalog('${def.id}')">
            <div class="flex items-center gap-2 mb-1">
                <span class="w-7 h-7 rounded-lg flex items-center justify-center text-base shrink-0" style="background:${esc(def.fill || c.fill)};border:1px solid ${esc(def.stroke || c.stroke)}">${esc(def.icon || '📦')}</span>
                <span class="text-xs font-semibold text-slate-800 leading-tight">${esc(name)}</span>
            </div>
            <div class="text-[11px] font-mono text-slate-500">${shortLen(def.W)}×${shortLen(def.D)} · h${shortLen(def.H)} ${unitSys === 'metric' ? t('cm') : ''}</div>
            ${deletable ? `<button class="btn-icon absolute top-1 right-1" onclick="event.stopPropagation();deleteCustomDef('${def.id}')" title="${esc(t('delete'))}">×</button>` : ''}
        </div>`;
    };
    let html;
    if (catalogTab === 'custom') {
        html = `<button class="cat-card border-dashed flex items-center justify-center text-xs font-semibold text-indigo-600" onclick="hideCatalog();showCustomForm()">${esc(t('createCustom'))}</button>`;
        html += customCatalog.map(d => card(d, d.name, true)).join('');
        if (!customCatalog.length) html += `<div class="col-span-full text-xs text-slate-400 py-2">${esc(t('noCustomYet'))}</div>`;
    } else {
        html = CATALOG.filter(d => d.cat === catalogTab).map(d => card(d, catalogName(d.id), false)).join('');
    }
    $('cat-grid').innerHTML = html;
}

function deleteCustomDef(id) {
    customCatalog = customCatalog.filter(d => d.id !== id);
    renderCatalog(); markDirty();
}

// ===== CUSTOM ITEM =====
function showCustomForm() {
    $('cust-name').value = '';
    $('cust-w').value = cmToInput(100);
    $('cust-d').value = cmToInput(60);
    $('cust-h').value = cmToInput(80);
    $('cust-swing').value = 0;
    $('custom-modal').classList.remove('hidden');
    setTimeout(() => $('cust-name').focus(), 50);
}
function hideCustomForm() { $('custom-modal').classList.add('hidden'); }

function addCustomItem() {
    const name = $('cust-name').value.trim().slice(0, 60) || t('customItem');
    const W = inputToCm($('cust-w').value), D = inputToCm($('cust-d').value), H = inputToCm($('cust-h').value);
    if (!(W >= 1 && D >= 1 && H >= 1)) { toast(t('invalidSize')); return; }
    const swing = Math.max(0, inputToCm($('cust-swing').value) || 0);
    const color = $('cust-color').value;
    const def = {
        id: newId('c'), custom: true, cat: 'custom', name,
        W: Math.round(W * 10) / 10, D: Math.round(D * 10) / 10, H: Math.round(H * 10) / 10,
        color, fill: lighten(color, 0.8), stroke: color,
        swingDepth: swing, dt: swing > 0 ? 'wardrobe' : 'box', icon: '🔧'
    };
    customCatalog.push(def);
    hideCustomForm();
    addItemFromDef(def);
}

// ===== PERSISTENCE =====
const LS_AUTO = 'roomplanner_autosave_v1';
const LS_SLOTS = 'roomplanner_slots_v1';

function serialize() {
    return {
        version: 1, lang, unit: unitSys,
        room: { ...room },
        openings: openings.map(o => ({ ...o })),
        furniture: furniture.map(f => ({ ...f })),
        customCatalog: customCatalog.map(d => ({ ...d })),
        settings: { ...settings }
    };
}

const COLOR_RE = /^#[0-9a-f]{3,8}$/i;
function sanitizeItem(f, isDef) {
    const num = (v, d, min, max) => { v = Number(v); return isFinite(v) ? clamp(v, min, max) : d; };
    const cat = CAT_COLORS[f.cat] ? f.cat : 'custom';
    const c = CAT_COLORS[cat];
    const out = {
        id: typeof f.id === 'string' && f.id ? f.id.slice(0, 60) : newId(isDef ? 'c' : 'f'),
        cat,
        W: num(f.W, 100, 1, 3000), D: num(f.D, 60, 1, 3000), H: num(f.H, 80, 1, 3000),
        dt: DRAW_TYPES.includes(f.dt) ? f.dt : 'box',
        icon: typeof f.icon === 'string' ? f.icon.slice(0, 8) : '📦',
        color: COLOR_RE.test(f.color) ? f.color : c.color,
        fill: COLOR_RE.test(f.fill) ? f.fill : c.fill,
        stroke: COLOR_RE.test(f.stroke) ? f.stroke : c.stroke,
        chairDepth: num(f.chairDepth, 0, 0, 500),
        swingDepth: num(f.swingDepth, 0, 0, 500),
    };
    if (isDef) {
        out.custom = true;
        out.name = String(f.name || '').slice(0, 60);
        return out;
    }
    out.catalogId = f.catalogId && ITEM_NAMES[f.catalogId] ? f.catalogId : null;
    out.customId = typeof f.customId === 'string' ? f.customId : null;
    out.custom = !!f.custom || !out.catalogId;
    out.name = f.name ? String(f.name).slice(0, 60) : null;
    out.x = num(f.x, 0, -5000, 5000); out.y = num(f.y, 0, -5000, 5000);
    out.rot = [0, 90, 180, 270].includes(+f.rot) ? +f.rot : 0;
    out.doorType = out.swingDepth > 0 ? (f.doorType === 'sliding' ? 'sliding' : 'hinged') : 'none';
    return out;
}

function deserialize(s, withPrefs) {
    if (!s || typeof s !== 'object' || !s.room) throw new Error('invalid');
    const num = (v, d, min, max) => { v = Number(v); return isFinite(v) ? clamp(v, min, max) : d; };
    room = {
        name: String(s.room.name || '').slice(0, 80),
        width: num(s.room.width, 400, 50, 5000),
        height: num(s.room.height, 400, 50, 5000),
        wallThickness: num(s.room.wallThickness, 20, 5, 60),
        ceilingHeight: num(s.room.ceilingHeight, 260, 100, 1000)
    };
    openings = (Array.isArray(s.openings) ? s.openings : [])
        .filter(o => o && (o.type === 'door' || o.type === 'window'))
        .map(o => normalizeOpening({ ...o, id: typeof o.id === 'string' ? o.id.slice(0, 60) : undefined }));
    openings.forEach(clampOpening);
    furniture = (Array.isArray(s.furniture) ? s.furniture : []).filter(f => f && typeof f === 'object').map(f => sanitizeItem(f, false));
    customCatalog = (Array.isArray(s.customCatalog) ? s.customCatalog : []).filter(f => f && typeof f === 'object').map(f => sanitizeItem(f, true));
    if (s.settings && typeof s.settings === 'object') {
        settings = { snap: s.settings.snap !== false, showDistances: s.settings.showDistances !== false, showZones: s.settings.showZones !== false };
    }
    if (withPrefs) {
        if (TR[s.lang]) lang = s.lang;
        if (s.unit === 'metric' || s.unit === 'imperial') unitSys = s.unit;
    }
    sel = null;
}

let saveTimer = null;
function markDirty() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        try { localStorage.setItem(LS_AUTO, JSON.stringify(serialize())); } catch (e) { /* storage full or disabled */ }
    }, 400);
}

function getSlots() {
    try { const s = JSON.parse(localStorage.getItem(LS_SLOTS)); return s && typeof s === 'object' ? s : {}; } catch (e) { return {}; }
}
function renderSlots(selectName) {
    const slots = getSlots();
    const names = Object.keys(slots).sort((a, b) => (slots[b].savedAt || 0) - (slots[a].savedAt || 0));
    const el = $('slot-select');
    const prev = selectName || el.value;
    el.innerHTML = names.length
        ? names.map(n => `<option value="${esc(n)}" ${n === prev ? 'selected' : ''}>${esc(n)}</option>`).join('')
        : `<option value="">${esc(t('noSlots'))}</option>`;
}
function saveToBrowser() {
    const name = (room.name || t('newRoom')).trim();
    const slots = getSlots();
    slots[name] = { savedAt: Date.now(), state: serialize() };
    try { localStorage.setItem(LS_SLOTS, JSON.stringify(slots)); } catch (e) { toast('localStorage error'); return; }
    renderSlots(name);
    toast(t('saved', name));
}
function loadSlot() {
    const name = $('slot-select').value;
    const slot = getSlots()[name];
    if (!slot) { toast(t('noSlots')); return; }
    try { deserialize(slot.state, false); } catch (e) { toast(t('importError')); return; }
    refreshAll(); markDirty();
    View3D.resetView();
    toast(t('loaded', name));
}
function deleteSlot() {
    const name = $('slot-select').value;
    const slots = getSlots();
    if (!slots[name] || !confirm(t('confirmDeleteSlot', name))) return;
    delete slots[name];
    localStorage.setItem(LS_SLOTS, JSON.stringify(slots));
    renderSlots();
    toast(t('slotDeleted', name));
}

function fileBase() {
    return (room.name || 'room-plan').trim().replace(/[^\p{L}\p{N}_-]+/gu, '-').replace(/^-+|-+$/g, '') || 'room-plan';
}
function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportJSON() {
    downloadBlob(new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' }), fileBase() + '.json');
    toast(t('exportedJson'));
}
function handleImport(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try { deserialize(JSON.parse(reader.result), false); }
        catch (err) { toast(t('importError')); return; }
        refreshAll(); markDirty();
        View3D.resetView();
        toast(t('importedOk'));
    };
    reader.readAsText(file);
}

function exportPNG() {
    const ext = room.wallThickness + maxOutExtent();
    const s = clamp(900 / (room.width + 2 * ext), 0.5, 3);
    const pad = 70, k = 2.5;
    const vw = Math.round((room.width + 2 * ext) * s + 2 * pad);
    const vh = Math.round((room.height + 2 * ext) * s + 2 * pad);
    const off = document.createElement('canvas');
    off.width = Math.round(vw * k); off.height = Math.round(vh * k);
    const c = off.getContext('2d');
    c.setTransform(k, 0, 0, k, 0, 0);
    renderScene(c, vw, vh, { exporting: true, pads: [pad, pad, pad] });
    draw();
    off.toBlob(b => { if (b) { downloadBlob(b, fileBase() + '.png'); toast(t('pngExported')); } }, 'image/png');
}

let toastTimer = null;
function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}

// ===== 3D VIEW =====
// three.js world units are cm: x = room x, z = room y (north at z = 0), y = up.
let viewMode = '2d';

function setView(mode) {
    viewMode = mode === '3d' ? '3d' : '2d';
    if (viewMode === '3d' && measure.active) toggleMeasure(false);
    canvas.classList.toggle('hidden', viewMode === '3d');
    renderViewToggle();
    if (viewMode === '3d') View3D.show(); else View3D.hide();
    draw();
}

function renderViewToggle() {
    $('view-toggle').innerHTML = ['2d', '3d'].map(m =>
        `<button class="toggle-btn ${m === viewMode ? 'active' : ''}" onclick="setView('${m}')">${m.toUpperCase()}</button>`).join('');
    const wb = $('walls-btn');
    if (wb) wb.textContent = t(View3D.lowWalls() ? 'wallsLow' : 'wallsFull');
}

const View3D = (() => {
    let THREE = null, OrbitControls = null, loading = null;
    let renderer, scene, camera, controls, sun, root;
    let active = false, dirty = true, fitted = false, lowWalls = false, raf = 0;
    let wallMats = {};
    const host = $('view3d'), ui = $('view3d-ui'), status = $('view3d-status');

    function load() {
        if (!loading) {
            loading = Promise.all([import('three'), import('three/addons/controls/OrbitControls.js')])
                .then(([T, O]) => { THREE = T; OrbitControls = O.OrbitControls; setup(); })
                .catch(err => { loading = null; throw err; });
        }
        return loading;
    }

    function setup() {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.domElement.style.cssText = 'width:100%;height:100%;display:block;touch-action:none';
        host.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        scene.background = new THREE.Color('#eef2f7');
        camera = new THREE.PerspectiveCamera(45, 1, 1, 50000);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 2.2));
        sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.bias = -0.0005;
        scene.add(sun, sun.target);

        root = new THREE.Group();
        scene.add(root);

        let down = null;
        renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
        renderer.domElement.addEventListener('pointerup', e => {
            if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5 && e.button === 0) pick(e);
            down = null;
        });
    }

    // --- geometry helpers ---
    function mat(color, extra) { return new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.02, ...extra }); }
    function shade(fill, color, k) { return new THREE.Color(fill).lerp(new THREE.Color(color), k); }

    function boxMesh(parent, w, h, d, x, y, z, material, edgeColor) {
        if (w <= 0.1 || h <= 0.1 || d <= 0.1) return null;
        const geo = new THREE.BoxGeometry(w, h, d);
        const m = new THREE.Mesh(geo, material);
        m.position.set(x, y, z);
        m.castShadow = true; m.receiveShadow = true;
        parent.add(m);
        if (edgeColor) {
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.45 }));
            edges.position.copy(m.position);
            parent.add(edges);
        }
        return m;
    }
    // Box spanning [u0,u1] × [y0,y1] × [v0,v1] in an item's local frame.
    function part(g, u0, u1, y0, y1, v0, v1, material, edgeColor) {
        return boxMesh(g, u1 - u0, y1 - y0, v1 - v0, (u0 + u1) / 2, (y0 + y1) / 2, (v0 + v1) / 2, material, edgeColor);
    }
    function wallToWorld(wall, along, inward) {
        switch (wall) {
            case 'north': return [along, inward];
            case 'south': return [along, room.height - inward];
            case 'west':  return [inward, along];
            default:      return [room.width - inward, along];
        }
    }
    // Vertical slab between two floor points.
    function slabBetween(p1, p2, thick, y0, y1, material, edgeColor) {
        const dx = p2[0] - p1[0], dz = p2[1] - p1[1];
        const len = Math.hypot(dx, dz);
        const m = boxMesh(root, len, y1 - y0, thick, 0, (y0 + y1) / 2, 0, material, null);
        if (!m) return null;
        m.position.x = (p1[0] + p2[0]) / 2; m.position.z = (p1[1] + p2[1]) / 2;
        m.rotation.y = Math.atan2(-dz, dx);
        if (edgeColor) {
            const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 0.5 }));
            e.position.copy(m.position); e.rotation.copy(m.rotation);
            root.add(e);
        }
        return m;
    }

    function disposeAll() {
        root.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
        });
        root.clear();
    }

    function build() {
        disposeAll();
        const W = room.width, H = room.height, wt = room.wallThickness;
        const wallH = lowWalls ? Math.min(100, room.ceilingHeight) : room.ceilingHeight;

        // Floor with a 50 cm grid
        const floor = boxMesh(root, W, 2, H, W / 2, -1, H / 2, mat('#ece3d3'), null);
        floor.castShadow = false;
        boxMesh(root, W + 2 * wt, 1, H + 2 * wt, W / 2, -2.5, H / 2, mat('#cbd5e1'), null).castShadow = false;
        const pts = [];
        for (let x = 50; x < W; x += 50) pts.push(x, 0.2, 0, x, 0.2, H);
        for (let z = 50; z < H; z += 50) pts.push(0, 0.2, z, W, 0.2, z);
        if (pts.length) {
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            root.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xc9bca5, transparent: true, opacity: 0.6 })));
        }

        // Walls, split around doors and windows
        wallMats = {};
        const glassMat = new THREE.MeshStandardMaterial({ color: '#7dd3fc', transparent: true, opacity: 0.35, roughness: 0.1 });
        const doorMat = mat('#b7835a');
        WALLS.forEach(wall => {
            const len = wallLen(wall), ext = isHorizontal(wall) ? wt : 0;
            const wallMat = wallMats[wall] = mat('#f1f5f9', { transparent: true });
            const piece = (a, b, y0, y1, material = wallMat, thick = wt) => {
                if (b - a < 0.5 || y1 - y0 < 0.5) return;
                slabBetween(wallToWorld(wall, a, -wt / 2), wallToWorld(wall, b, -wt / 2), thick, y0, y1, material, material === wallMat ? '#94a3b8' : null);
            };
            let cur = -ext;
            openings.filter(o => o.wall === wall).sort((p, q) => p.offset - q.offset).forEach(o => {
                const a = clamp(o.offset, 0, len), b = clamp(o.offset + o.width, 0, len);
                if (a > cur) piece(cur, a, 0, wallH);
                const s0 = Math.max(a, cur);
                if (o.type === 'door') {
                    piece(s0, b, Math.min(o.height, wallH), wallH);
                    let hinge, end;
                    if (o.swing === 'out') { hinge = [o.offset, -wt]; end = [o.offset, -wt - o.width]; }
                    else if (o.swing === 'in-left') { hinge = [o.offset, 0]; end = [o.offset, o.width]; }
                    else { hinge = [o.offset + o.width, 0]; end = [o.offset + o.width, o.width]; }
                    slabBetween(wallToWorld(wall, ...hinge), wallToWorld(wall, ...end), 4, 0, Math.min(o.height, wallH), doorMat, '#7c4a28');
                } else {
                    const sill = o.heightFromFloor === null || o.heightFromFloor === undefined ? 90 : o.heightFromFloor;
                    const top = Math.min(sill + o.height, wallH);
                    piece(s0, b, 0, Math.min(sill, wallH));
                    piece(s0, b, top, wallH);
                    if (top > sill) piece(s0, b, sill, top, glassMat, 2);
                }
                cur = Math.max(cur, b);
            });
            piece(cur, len + ext, 0, wallH);
        });

        furniture.forEach(it => buildItem(it, sel && sel.kind === 'furniture' && sel.id === it.id));

        const S = Math.max(W, H);
        sun.position.set(W * 0.75, S * 1.6 + 300, H * 1.2);
        sun.target.position.set(W / 2, 0, H / 2);
        Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 1, far: S * 5 + 1000 });
        sun.shadow.camera.updateProjectionMatrix();
    }

    function buildItem(it, selected) {
        const g = new THREE.Group();
        const W = it.W, D = it.D, H = it.H;
        const extra = selected ? { emissive: new THREE.Color('#2563eb'), emissiveIntensity: 0.35 } : {};
        const base = mat(shade(it.fill, it.color, 0.35), extra);
        const accent = mat(shade(it.fill, it.color, 0.75), extra);
        const white = mat('#f8fafc', extra);
        const dark = mat('#1f2937', extra);
        const edge = selected ? '#1d4ed8' : it.stroke;
        const legs = (top, inset = 3, size = 4) => {
            [[inset, inset], [W - inset - size, inset], [inset, D - inset - size], [W - inset - size, D - inset - size]]
                .forEach(([u, v]) => part(g, u, u + size, 0, top, v, v + size, dark));
        };
        const lift = Math.min(25, H * 0.5);
        switch (it.dt) {
            case 'bed': {
                part(g, 0, W, 0, lift, 0, D, accent, edge);
                part(g, 2, W - 2, lift, H, 4, D - 2, white, '#cbd5e1');
                part(g, 1, W - 1, lift + 1, H + 1.5, D * 0.38, D - 1, base, edge);
                const n = W >= 120 ? 2 : 1, m = 8, pw = (W - m * (n + 1)) / n;
                for (let i = 0; i < n; i++) part(g, m + i * (pw + m), m + i * (pw + m) + pw, H, H + 10, 10, 10 + Math.min(32, D * 0.16), white, '#cbd5e1');
                part(g, 0, W, 0, Math.max(H + 45, 90), 0, 5, accent, edge);
                break;
            }
            case 'sofa': {
                const back = Math.min(20, D * 0.25), arm = Math.min(16, W * 0.12), seat = Math.min(45, H * 0.55);
                part(g, 0, W, 0, seat, 0, D, base, edge);
                part(g, 0, W, seat, H, 0, back, accent, edge);
                part(g, 0, arm, seat, Math.min(H, seat + 18), back, D, accent, edge);
                part(g, W - arm, W, seat, Math.min(H, seat + 18), back, D, accent, edge);
                break;
            }
            case 'desk': case 'table': {
                part(g, 0, W, H - 4, H, 0, D, base, edge);
                legs(H - 4);
                if (it.chairDepth > 0) {
                    const cs = Math.min(45, W * 0.6), cu = W / 2 - cs / 2, cv = D + (it.chairDepth - cs) / 2;
                    part(g, cu, cu + cs, 42, 46, cv, cv + cs, mat('#6ee7b7', extra), '#059669');
                    part(g, cu, cu + cs, 46, 90, cv + cs - 5, cv + cs, mat('#6ee7b7', extra), '#059669');
                    part(g, cu + cs / 2 - 2, cu + cs / 2 + 2, 0, 42, cv + cs / 2 - 2, cv + cs / 2 + 2, dark);
                }
                break;
            }
            case 'ldesk': {
                const a = Math.min(60, W / 2), b = Math.min(60, D / 2);
                part(g, 0, W, H - 4, H, 0, b, base, edge);
                part(g, 0, a, H - 4, H, b, D, base, edge);
                [[2, 2], [W - 6, 2], [2, D - 6], [a - 6, D - 6], [W - 6, b - 6]].forEach(([u, v]) => part(g, u, u + 4, 0, H - 4, v, v + 4, dark));
                break;
            }
            case 'chair': {
                const seat = Math.min(46, H * 0.5);
                part(g, 0, W, seat - 4, seat, 0, D, base, edge);
                part(g, 0, W, seat, H, 0, 5, accent, edge);
                legs(seat - 4, 2, 3);
                break;
            }
            case 'tv':
                part(g, 0, W, 0, H, 0, D, base, edge);
                part(g, W * 0.12, W * 0.88, H + 4, H + 4 + Math.min(80, W * 0.42), D * 0.4, D * 0.4 + 4, dark);
                part(g, W * 0.45, W * 0.55, H, H + 4, D * 0.3, D * 0.6, dark);
                break;
            case 'bathtub':
                part(g, 0, W, 0, H, 0, D, white, '#94a3b8');
                part(g, 8, W - 8, H - 1, H + 0.3, 8, D - 8, mat('#bae6fd', extra));
                break;
            case 'shower':
                part(g, 0, W, 0, 6, 0, D, white, '#94a3b8');
                part(g, 0, W, 6, H, 0, D, new THREE.MeshStandardMaterial({ color: '#bae6fd', transparent: true, opacity: 0.18, roughness: 0.1 }), '#38bdf8');
                break;
            case 'toilet': {
                part(g, W * 0.08, W * 0.92, 0, H + 38, 0, D * 0.28, white, '#94a3b8');
                const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.8, H, 24), white);
                bowl.scale.set(W * 0.42, 1, D * 0.36);
                bowl.position.set(W / 2, H / 2, D * 0.62);
                bowl.castShadow = true;
                g.add(bowl);
                break;
            }
            case 'sink':
                part(g, 0, W, 0, H - 4, 0, D, base, edge);
                part(g, 0, W, H - 4, H, 0, D, white, '#94a3b8');
                part(g, W / 2 - 2, W / 2 + 2, H, H + 18, 3, 7, dark);
                break;
            case 'washer': case 'fridge':
                part(g, 0, W, 0, H, 0, D, white, edge);
                if (it.dt === 'washer') {
                    const door = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(W, H) * 0.3, Math.min(W, H) * 0.3, 2, 32), dark);
                    door.rotation.x = Math.PI / 2;
                    door.position.set(W / 2, H * 0.45, D + 1);
                    g.add(door);
                } else {
                    part(g, W * 0.8, W * 0.85, H * 0.3, H * 0.75, D, D + 3, dark);
                }
                break;
            default:
                part(g, 0, W, 0, H, 0, D, base, edge);
                if (it.dt === 'wardrobe' || it.dt === 'cabinet') {
                    const n = Math.max(1, Math.round(W / 50)), lw = W / n;
                    for (let i = 0; i < n; i++) {
                        const hx = i % 2 === 0 ? (i + 1) * lw - 5 : i * lw + 3;
                        part(g, hx, hx + 2, H * 0.4, H * 0.6, D, D + 2, dark);
                    }
                }
        }
        g.traverse(o => { o.userData.itemId = it.id; });
        g.rotation.y = -it.rot * Math.PI / 180;
        const pos = it.rot === 90 ? [it.x + it.D, it.y] : it.rot === 180 ? [it.x + it.W, it.y + it.D] : it.rot === 270 ? [it.x, it.y + it.W] : [it.x, it.y];
        g.position.set(pos[0], 0, pos[1]);
        root.add(g);
    }

    function pick(e) {
        const r = renderer.domElement.getBoundingClientRect();
        const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        const ray = new THREE.Raycaster();
        ray.setFromCamera(ndc, camera);
        const hit = ray.intersectObjects(root.children, true).find(h => h.object.isMesh && h.object.userData.itemId);
        select(hit ? { kind: 'furniture', id: hit.object.userData.itemId } : null);
        draw();
    }

    // Walls standing between the camera and the room become see-through.
    function fadeWalls() {
        const c = camera.position;
        const outside = { north: c.z < 0, south: c.z > room.height, west: c.x < 0, east: c.x > room.width };
        Object.entries(wallMats).forEach(([wall, m]) => {
            const op = outside[wall] ? 0.12 : 1;
            if (m.opacity !== op) { m.opacity = op; m.depthWrite = op === 1; }
        });
    }

    function frame() {
        if (!active) return;
        raf = requestAnimationFrame(frame);
        if (dirty) { build(); dirty = false; }
        controls.update();
        fadeWalls();
        renderer.render(scene, camera);
    }

    function aim(pos) {
        const cx = room.width / 2, cz = room.height / 2;
        controls.target.set(cx, Math.min(80, room.ceilingHeight / 3), cz);
        camera.position.set(...pos);
        controls.update();
    }

    return {
        lowWalls: () => lowWalls,
        markDirty() { dirty = true; },
        async show() {
            active = true;
            host.classList.remove('hidden');
            status.classList.add('hidden');
            if (!THREE) {
                status.textContent = t('loading3d');
                status.classList.remove('hidden');
                try { await load(); }
                catch (err) { status.textContent = t('error3d'); return; }
                status.classList.add('hidden');
                if (!active) return;
            }
            ui.classList.remove('hidden');
            this.resize();
            if (!fitted) { this.resetView(); fitted = true; }
            dirty = true;
            cancelAnimationFrame(raf);
            frame();
        },
        hide() {
            active = false;
            cancelAnimationFrame(raf);
            host.classList.add('hidden');
            ui.classList.add('hidden');
            status.classList.add('hidden');
        },
        resize() {
            if (!renderer) return;
            const r = host.getBoundingClientRect();
            if (r.width < 2 || r.height < 2) return;
            renderer.setSize(r.width, r.height, false);
            camera.aspect = r.width / r.height;
            camera.updateProjectionMatrix();
        },
        resetView() {
            if (!camera) return;
            const S = Math.max(room.width, room.height);
            aim([room.width / 2 + S * 0.75, S * 1.15 + 150, room.height / 2 + S * 1.35]);
        },
        topView() {
            if (!camera) return;
            const S = Math.max(room.width, room.height);
            aim([room.width / 2, S * 1.9, room.height / 2 + 1]);
        },
        toggleWalls() {
            lowWalls = !lowWalls;
            dirty = true;
            renderViewToggle();
        }
    };
})();

// ===== INIT =====
function init() {
    let restored = false;
    try {
        const raw = localStorage.getItem(LS_AUTO);
        if (raw) { deserialize(JSON.parse(raw), true); restored = true; }
    } catch (e) { restored = false; }
    if (!restored) applyTemplate('empty', true);
    new ResizeObserver(() => resizeCanvas()).observe(wrapper);
    resizeCanvas();
    setLang(lang);
    if (!restored) showSetup(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
}
init();
</script>
</body>
</html>
