<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }
    input, textarea, select { user-select: text; -webkit-user-select: text; }
    .font-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    canvas { touch-action: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .section { border-bottom: 1px solid #e2e8f0; padding: 12px; }
    .section:last-child { border-bottom: none; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #64748b; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 10px; font-size: 12px; font-weight: 500; line-height: 1.2; border-radius: 8px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s, border-color .15s; }
    .btn-primary { background: #4f46e5; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #f1f5f9; color: #334155; border-color: #e2e8f0; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-dark { background: #1e293b; color: #fff; }
    .btn-dark:hover { background: #0f172a; }
    .btn-danger { background: #ffe4e6; color: #be123c; }
    .btn-danger:hover { background: #fecdd3; }
    .btn-icon { padding: 2px 6px; font-size: 13px; color: #94a3b8; border-radius: 6px; background: transparent; border: none; cursor: pointer; }
    .btn-icon:hover { color: #e11d48; background: #ffe4e6; }

    .toggle-group { display: inline-flex; background: #f1f5f9; border-radius: 8px; padding: 2px; }
    .toggle-btn { padding: 4px 8px; font-size: 12px; font-weight: 600; border-radius: 6px; color: #64748b; cursor: pointer; border: none; background: transparent; }
    .toggle-btn:hover { color: #334155; }
    .toggle-btn.active { background: #fff; color: #4338ca; box-shadow: 0 1px 2px rgba(0,0,0,.1); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #fff; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.35); width: 100%; max-width: 42rem; max-height: 88vh; overflow-y: auto; }

    .input { width: 100%; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; background: #fff; color: #1e293b; }
    .input:focus, .tb-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.25); }
    .label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 3px; }
    .tb-input { width: 58px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 5px; font-family: 'JetBrains Mono', monospace; background: #fff; }
    .tb-select { font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 4px; background: #fff; }

    .item-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: background-color .1s; }
    .item-row:hover { background: #f8fafc; }
    .item-row.active { background: #eef2ff; box-shadow: inset 0 0 0 1px #c7d2fe; }
    .item-row.active-opening { background: #fffbeb; box-shadow: inset 0 0 0 1px #fcd34d; }

    .cat-tab { padding: 6px 12px; font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; white-space: nowrap; border: none; background: #f1f5f9; color: #475569; }
    .cat-tab:hover { background: #e2e8f0; }
    .cat-tab.active { background: #4f46e5; color: #fff; }
    .cat-card { text-align: left; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; cursor: pointer; background: #fff; transition: border-color .15s, box-shadow .15s; position: relative; }
    .cat-card:hover { border-color: #818cf8; box-shadow: 0 4px 12px rgba(79,70,229,.12); }

    .ergo { display: flex; align-items: flex-start; gap: 6px; border-radius: 8px; padding: 5px 8px; border: 1px solid; }
    .ergo.ok { color: #047857; background: #ecfdf5; border-color: #a7f3d0; }
    .ergo.warning { color: #92400e; background: #fffbeb; border-color: #fde68a; }
    .ergo.error { color: #9f1239; background: #fff1f2; border-color: #fecdd3; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden select-none">

<!-- ===== HEADER ===== -->
<header class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-sm z-10">
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">RP</div>
        <div class="min-w-0">
            <h1 class="text-sm font-bold text-slate-900 leading-tight truncate">
                <span data-t="appTitle">Room Planner</span>
                <span class="text-slate-300">·</span>
                <span id="header-room" class="text-slate-700"></span>
                <span class="font-mono text-indigo-600 text-xs" id="header-dims"></span>
            </h1>
            <p class="text-[11px] text-slate-400 hidden lg:block" data-t="headerHint"></p>
        </div>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
        <div class="toggle-group" id="view-toggle"></div>
        <button id="measure-btn" class="btn btn-secondary" onclick="toggleMeasure()" data-t-title="measureHint">📏 <span data-t="measure" class="hidden sm:inline">Measure</span></button>
        <select id="template-select" onchange="onTemplateSelect(this)" class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white cursor-pointer"></select>
        <div class="hidden sm:flex items-center gap-2">
            <div class="toggle-group lang-toggle"></div>
            <div class="toggle-group unit-toggle"></div>
        </div>
        <button class="btn btn-secondary lg:hidden" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    </div>
</header>

<!-- ===== MAIN LAYOUT ===== -->
<div class="flex-1 flex flex-col lg:flex-row overflow-hidden">

    <main class="flex-1 relative bg-[#f8fafc] overflow-hidden min-h-[220px]" id="canvas-wrapper">
        <canvas id="planCanvas" class="absolute inset-0 w-full h-full block"></canvas>
        <div id="view3d" class="hidden absolute inset-0"></div>
        <div id="view3d-ui" class="hidden absolute top-3 left-3 right-3 z-10 flex flex-wrap items-center gap-1.5 pointer-events-none">
            <button class="btn btn-secondary bg-white pointer-events-auto" onclick="View3D.resetView()" data-t="resetView">Reset view</button>
            <button class="btn btn-secondary bg-white pointer-events-auto" onclick="View3D.topView()" data-t="topView">Top view</button>
            <button class="btn btn-secondary bg-white pointer-events-auto" id="walls-btn" onclick="View3D.toggleWalls()"></button>
            <span class="text-[11px] text-slate-500 bg-white/80 rounded-md px-2 py-1" data-t="hint3d"></span>
        </div>
        <div id="view3d-status" class="hidden absolute inset-0 flex items-center justify-center text-sm text-slate-500"></div>
        <div id="measure-hint" class="hidden absolute top-3 left-1/2 -translate-x-1/2 z-10 bg-slate-900 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow pointer-events-none" data-t="measureHint"></div>
        <div id="sel-toolbar" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur border border-slate-200 shadow-lg rounded-xl px-3 py-2 items-center gap-2 text-xs z-10 max-w-[96%] overflow-x-auto"></div>
    </main>

    <!-- ===== SIDEBAR ===== -->
    <aside id="sidebar" class="w-full lg:w-80 xl:w-96 bg-white border-t lg:border-t-0 lg:border-l border-slate-200 flex hidden lg:flex flex-col max-h-[45vh] lg:max-h-full overflow-y-auto shrink-0">

        <!-- Room -->
        <div class="section">
            <div class="flex items-center justify-between mb-1.5">
                <h2 class="section-title">🏠 <span data-t="room">Room</span></h2>
                <button onclick="showSetup(false)" class="text-[11px] text-indigo-600 hover:text-indigo-800 font-semibold">✎ <span data-t="edit">Edit</span></button>
            </div>
            <div class="text-sm font-semibold text-slate-800" id="room-name-display"></div>
            <div class="text-xs"><span id="room-dims-display" class="font-mono text-indigo-600"></span> <span id="room-dims-alt" class="font-mono text-slate-400"></span></div>
            <div class="text-[11px] text-slate-500 mt-0.5"><span data-t="wallThickness">Wall thickness</span>: <span id="room-wt-display" class="font-mono"></span> · <span data-t="ceilingHeight">Ceiling height</span>: <span id="room-ch-display" class="font-mono"></span></div>
        </div>

        <!-- Furniture -->
        <div class="section">
            <div class="flex items-center justify-between mb-2 gap-2">
                <h2 class="section-title">📦 <span data-t="furniture">Furniture</span></h2>
                <div class="flex gap-1">
                    <button onclick="showCatalog()" class="btn btn-primary" data-t="catalogBtn">+ Catalog</button>
                    <button onclick="showCustomForm()" class="btn btn-secondary" data-t="customBtn">+ Custom</button>
                </div>
            </div>
            <div id="furniture-list" class="space-y-0.5 max-h-48 lg:max-h-64 overflow-y-auto"></div>
        </div>

        <!-- Doors & Windows -->
        <div class="section">
            <div class="flex items-center justify-between mb-2 gap-2">
                <h2 class="section-title">🚪 <span data-t="doorsWindows">Doors & Windows</span></h2>
                <div class="flex gap-1">
                    <button onclick="showOpeningForm('door')" class="btn btn-primary">+ 🚪</button>
                    <button onclick="showOpeningForm('window')" class="btn btn-secondary">+ 🪟</button>
                </div>
            </div>
            <div id="openings-list" class="space-y-0.5 max-h-40 overflow-y-auto"></div>
            <div id="opening-form" class="hidden mt-2 p-2.5 bg-slate-50 border border-slate-200 rounded-lg space-y-2">
                <div class="text-xs font-semibold text-slate-700" id="opening-form-title"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="label" data-t="wall">Wall</label><select id="op-wall" class="input"></select></div>
                    <div><label class="label"><span data-t="width">Width</span> (<span class="unit-label"></span>)</label><input id="op-width" type="number" class="input font-mono" min="1"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="label"><span data-t="height">Height</span> (<span class="unit-label"></span>)</label><input id="op-height" type="number" class="input font-mono" min="1"></div>
                    <div id="op-swing-row"><label class="label" data-t="swing">Swing</label><select id="op-swing" class="input"></select></div>
                    <div id="op-floor-row"><label class="label"><span data-t="heightFromFloor">Height from floor</span> (<span class="unit-label"></span>)</label><input id="op-floor" type="number" class="input font-mono" min="0" data-t-ph="optional"></div>
                </div>
                <div id="op-depth-row"><label class="label"><span data-t="zoneDepth">Opening zone depth</span> (<span class="unit-label"></span>)</label><input id="op-depth" type="number" class="input font-mono" min="0"></div>
                <div class="flex gap-2">
                    <button onclick="addOpening()" class="btn btn-primary flex-1" data-t="add">Add</button>
                    <button onclick="hideOpeningForm()" class="btn btn-secondary flex-1" data-t="cancel">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div class="section space-y-2">
            <h2 class="section-title mb-1">⚙️ <span data-t="settings">Settings</span></h2>
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-xs text-slate-700" data-t="snapToGrid">Snap to grid (5 cm)</span>
                <input type="checkbox" id="chk-snap" onchange="setSetting('snap', this.checked)" class="w-4 h-4 accent-indigo-600">
            </label>
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-xs text-slate-700" data-t="showDistances">Show distances to walls</span>
                <input type="checkbox" id="chk-dist" onchange="setSetting('showDistances', this.checked)" class="w-4 h-4 accent-indigo-600">
            </label>
            <label class="flex items-center justify-between cursor-pointer">
                <span class="text-xs text-slate-700" data-t="showOpeningZones">Show opening zones</span>
                <input type="checkbox" id="chk-zones" onchange="setSetting('showZones', this.checked)" class="w-4 h-4 accent-indigo-600">
            </label>
            <div class="flex items-center justify-between">
                <span class="text-xs text-slate-700">📏 <span data-t="units">Units</span></span>
                <div class="toggle-group unit-toggle"></div>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-xs text-slate-700">🌐 <span data-t="language">Language</span></span>
                <div class="toggle-group lang-toggle"></div>
            </div>
        </div>

        <!-- Ergonomics -->
        <div class="section">
            <div class="flex items-center justify-between mb-2">
                <h2 class="section-title">✅ <span data-t="ergonomics">Ergonomics Check</span></h2>
                <span id="ergo-badge" class="px-2 py-0.5 text-[11px] font-semibold rounded-full"></span>
            </div>
            <div id="ergo-list" class="space-y-1 text-xs"></div>
        </div>

        <!-- Save / Load -->
        <div class="section space-y-2">
            <h2 class="section-title mb-1">💾 <span data-t="saveLoad">Save / Load</span></h2>
            <button onclick="saveToBrowser()" class="btn btn-dark w-full" data-t="saveBrowser">Save to browser</button>
            <div class="flex gap-1.5">
                <select id="slot-select" class="input flex-1"></select>
                <button onclick="loadSlot()" class="btn btn-secondary" data-t="load">Load</button>
                <button onclick="deleteSlot()" class="btn btn-danger" data-t-title="deleteSlot">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
                <button onclick="exportJSON()" class="btn btn-secondary" data-t="exportJson">Export JSON</button>
                <button onclick="$('import-file').click()" class="btn btn-secondary" data-t="importJson">Import JSON</button>
            </div>
            <button onclick="exportPNG()" class="btn btn-secondary w-full" data-t="exportPng">Export PNG</button>
            <input type="file" id="import-file" accept=".json,application/json" class="hidden" onchange="handleImport(event)">
        </div>
    </aside>
</div>

<!-- ===== ROOM SETUP MODAL ===== -->
<div id="setup-modal" class="modal-overlay hidden" onclick="if(event.target===this)hideSetup()">
    <div class="modal-box">
        <div class="sticky top-0 bg-white border-b px-5 py-4 flex items-center justify-between z-10">
            <h2 class="text-base font-bold text-slate-900">🏠 <span data-t="roomSetup">Room Setup</span></h2>
            <button onclick="hideSetup()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
        </div>
        <div class="p-5 space-y-5">
            <p id="setup-intro" class="text-sm text-slate-600 hidden" data-t="setupIntro"></p>
            <div class="space-y-3">
                <div><label class="label" data-t="roomName">Room name</label><input id="setup-name" class="input" maxlength="80"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="label"><span data-t="width">Width</span> (<span class="unit-label"></span>)</label><input id="setup-w" type="number" class="input font-mono" min="1"></div>
                    <div><label class="label"><span data-t="length">Length</span> (<span class="unit-label"></span>)</label><input id="setup-h" type="number" class="input font-mono" min="1"></div>
                </div>
                <div><label class="label"><span data-t="ceilingHeight">Ceiling height</span> (<span class="unit-label"></span>)</label><input id="setup-ch" type="number" class="input font-mono" min="1"></div>
                <div>
                    <label class="label"><span data-t="wallThickness">Wall thickness</span>: <span id="setup-wt-val" class="font-mono text-indigo-600"></span></label>
                    <input id="setup-wt" type="range" min="5" max="60" step="1" class="w-full accent-indigo-600" oninput="$('setup-wt-val').textContent = toDisp(+this.value)">
                </div>
                <button onclick="applySetup()" class="btn btn-primary w-full" data-t="apply">Apply</button>
            </div>
            <div>
                <div class="section-title mb-2" data-t="startFromTemplate">Start from a template</div>
                <div id="setup-templates" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
            </div>
        </div>
    </div>
</div>

<!-- ===== CATALOG MODAL ===== -->
<div id="catalog-modal" class="modal-overlay hidden" onclick="if(event.target===this)hideCatalog()">
    <div class="modal-box">
        <div class="sticky top-0 bg-white border-b px-5 py-4 z-10">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-bold text-slate-900" data-t="catalog">Furniture Catalog</h2>
                <button onclick="hideCatalog()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
            </div>
            <div class="flex gap-1.5 overflow-x-auto pb-1" id="cat-tabs"></div>
        </div>
        <div class="p-5">
            <div id="cat-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
        </div>
    </div>
</div>

<!-- ===== CUSTOM ITEM MODAL ===== -->
<div id="custom-modal" class="modal-overlay hidden" onclick="if(event.target===this)hideCustomForm()">
    <div class="modal-box" style="max-width: 24rem">
        <div class="px-5 py-4 border-b flex items-center justify-between">
            <h2 class="text-base font-bold text-slate-900">🔧 <span data-t="customItem">Custom Item</span></h2>
            <button onclick="hideCustomForm()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
        </div>
        <div class="p-5 space-y-3">
            <div><label class="label" data-t="name">Name</label><input id="cust-name" class="input" maxlength="60" data-t-ph="myFurniture"></div>
            <div class="grid grid-cols-3 gap-2">
                <div><label class="label"><span data-t="width">Width</span> (<span class="unit-label"></span>)</label><input id="cust-w" type="number" class="input font-mono" min="1"></div>
                <div><label class="label"><span data-t="depth">Depth</span> (<span class="unit-label"></span>)</label><input id="cust-d" type="number" class="input font-mono" min="1"></div>
                <div><label class="label"><span data-t="height">Height</span> (<span class="unit-label"></span>)</label><input id="cust-h" type="number" class="input font-mono" min="1"></div>
            </div>
            <div><label class="label" data-t="color">Color</label><input id="cust-color" type="color" value="#6366f1" class="w-full h-9 rounded-lg cursor-pointer border border-slate-300 bg-white"></div>
            <div>
                <label class="label"><span data-t="customZone">Door swing zone depth</span> (<span class="unit-label"></span>)</label>
                <input id="cust-swing" type="number" class="input font-mono" min="0" value="0">
                <p class="text-[11px] text-slate-400 mt-1" data-t="customZoneHint"></p>
            </div>
            <button onclick="addCustomItem()" class="btn btn-primary w-full" data-t="addToRoom">Add to room</button>
        </div>
    </div>
</div>

<div id="toast" class="hidden fixed bottom-4 right-4 z-[60] bg-slate-900 text-white text-xs font-medium px-3 py-2 rounded-lg shadow-lg"></div>

<script>
/* ================================================================
   UNIVERSAL ROOM PLANNER
   Internal unit: centimetres. Room interior spans (0,0)–(width,height).
   North = top (y=0), South = bottom, West = left (x=0), East = right.
   ================================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ===== I18N =====
const TR = {
  en: {
    appTitle: 'Room Planner', headerHint: 'Drag to move · R rotate · D duplicate · Del delete · M measure',
    templates: 'Templates…', room: 'Room', edit: 'Edit', roomSetup: 'Room Setup', roomName: 'Room name',
    cm: 'cm', width: 'Width', depth: 'Depth', length: 'Length', height: 'Height', wallThickness: 'Wall thickness', wShort: 'W', dShort: 'D', hShort: 'H',
    apply: 'Apply', cancel: 'Cancel', add: 'Add', addToRoom: 'Add to room',
    startFromTemplate: 'Or start from a template',
    setupIntro: 'Welcome! Set your room size, or pick a ready-made template below. You can change everything later.',
    furniture: 'Furniture', catalogBtn: '+ Catalog', customBtn: '+ Custom',
    noFurniture: 'No furniture yet. Add items from the catalog or create your own.',
    doorsWindows: 'Doors & Windows', door: 'Door', window: 'Window', addDoor: 'Add door', addWindow: 'Add window',
    noOpenings: 'No doors or windows yet.', wall: 'Wall',
    north: 'North', south: 'South', east: 'East', west: 'West', onWall: w => `${w} wall`,
    swing: 'Swing', swingOut: 'Outward', swingInLeft: 'Inward, hinge left', swingInRight: 'Inward, hinge right',
    heightFromFloor: 'Height from floor', optional: 'optional', fromFloor: v => `${v} from floor`,
    zoneDepth: 'Opening zone depth',
    settings: 'Settings', snapToGrid: 'Snap to grid (5 cm)', showDistances: 'Show distances to walls',
    showOpeningZones: 'Show door/window opening zones', units: 'Units', language: 'Language',
    ergonomics: 'Ergonomics Check', statusOk: 'All clear', statusWarn: n => `${n} warning${n === 1 ? '' : 's'}`,
    statusErr: n => `${n} problem${n === 1 ? '' : 's'}`,
    okNoOverlaps: 'No overlaps', okInside: 'All furniture inside the room', okDoors: 'Door clearance OK',
    okWindows: 'Window zones clear', okOpenings: 'Doors and windows fit the walls', okSwing: 'Cabinet doors can open',
    overlap: (a, b) => `"${a}" overlaps "${b}"`, outsideRoom: a => `"${a}" is outside the room`,

// ===== UNITS =====
let unitSys = 'metric'; // 'metric' | 'imperial'
function toDisp(cm) {
    if (unitSys === 'imperial') {
        const ti = Math.round(cm / 2.54);
        return `${Math.floor(ti / 12)}'${ti % 12}"`;
    }
    return `${Math.round(cm)} ${t('cm')}`;
}
function altDisp(cm) {
    if (unitSys === 'imperial') return `${Math.round(cm)} ${t('cm')}`;
    const ti = Math.round(cm / 2.54);
    return `${Math.floor(ti / 12)}'${ti % 12}"`;
}
function shortLen(cm) { return unitSys === 'imperial' ? `${Math.round(cm / 2.54)}"` : String(Math.round(cm)); }
function cmToInput(cm) { return unitSys === 'imperial' ? Math.round(cm / 2.54 * 10) / 10 : Math.round(cm * 10) / 10; }
function inputToCm(v) { const n = parseFloat(v); if (!isFinite(n)) return NaN; return unitSys === 'imperial' ? n * 2.54 : n; }
function unitLabel() { return unitSys === 'imperial' ? 'in' : t('cm'); }

// ===== STATE =====
const WALLS = ['north', 'south', 'east', 'west'];
const WALL_ADJ = { north: ['west', 'east'], south: ['west', 'east'], west: ['north', 'south'], east: ['north', 'south'] };
let room = { name: '', width: 400, height: 400, wallThickness: 20, ceilingHeight: 260 };
let openings = [];
let furniture = [];
let customCatalog = [];
let settings = { snap: true, showDistances: true, showZones: true };
let sel = null;          // { kind: 'furniture' | 'opening', id }
let drag = null;
let uidCounter = 0;
function newId(prefix) { return `${prefix}-${Date.now().toString(36)}-${(uidCounter++).toString(36)}`; }

function getItemRect(it) {
    const r90 = it.rot === 90 || it.rot === 270;
    return { x: it.x, y: it.y, w: r90 ? it.D : it.W, h: r90 ? it.W : it.D };
}
function wallLen(wall) { return wall === 'north' || wall === 'south' ? room.width : room.height; }
function isHorizontal(wall) { return wall === 'north' || wall === 'south'; }
function selectedFurniture() { return sel && sel.kind === 'furniture' ? furniture.find(f => f.id === sel.id) : null; }
function selectedOpening() { return sel && sel.kind === 'opening' ? openings.find(o => o.id === sel.id) : null; }

function lighten(hex, amt) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return '#f1f5f9';
    const n = parseInt(m[1], 16);
    const ch = s => Math.round(((n >> s) & 255) + (255 - ((n >> s) & 255)) * amt);
    return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}

function makeItem(def, x, y, rot) {
    const c = CAT_COLORS[def.cat] || CAT_COLORS.custom;
    return {
        id: newId('f'),
        catalogId: def.custom ? null : def.id,
        customId: def.custom ? def.id : null,
        name: def.custom ? def.name : null,
        custom: !!def.custom,
        cat: def.cat || 'custom',
        W: def.W, D: def.D, H: def.H,
        x: x || 0, y: y || 0, rot: rot || 0,
        dt: def.dt || 'box', icon: def.icon || '📦',
        color: def.color || c.color, fill: def.fill || c.fill, stroke: def.stroke || c.stroke,
        chairDepth: def.chairDepth || 0,
        swingDepth: def.swingDepth || 0,
        doorType: def.swingDepth ? (def.doorType || 'hinged') : 'none'
    };
}

function normalizeOpening(o) {
    const isDoor = o.type === 'door';
    const num = (v, d) => (v === null || v === undefined || v === '' || !isFinite(+v)) ? d : +v;
    const wall = WALLS.includes(o.wall) ? o.wall : 'south';
    const res = {
        id: o.id || newId(o.type),
        type: isDoor ? 'door' : 'window',
        wall,
        offset: Math.max(0, num(o.offset, 0)),
        width: clamp(num(o.width, isDoor ? 80 : 120), 10, 3000),
        height: clamp(num(o.height, isDoor ? 210 : 140), 10, 1000),
    };
    if (isDoor) res.swing = ['out', 'in-left', 'in-right'].includes(o.swing) ? o.swing : 'in-left';
    else {
        res.swingDepth = clamp(num(o.swingDepth, 50), 0, 500);
        const hf = num(o.heightFromFloor, null);
        res.heightFromFloor = hf === null ? null : clamp(hf, 0, 1000);
    }
    return res;
}

function clampOpening(o) {
    const len = wallLen(o.wall);
    o.width = Math.min(o.width, len);
    o.offset = clamp(o.offset, 0, Math.max(0, len - o.width));
}
function clampItem(it) {
    const r = getItemRect(it);
    it.x = clamp(it.x, 0, Math.max(0, room.width - r.w));
    it.y = clamp(it.y, 0, Math.max(0, room.height - r.h));
}

// ===== GEOMETRY HELPERS =====
function rectsOverlap(a, b) {
    return a.x < b.x + b.w - 0.5 && a.x + a.w > b.x + 0.5 && a.y < b.y + b.h - 0.5 && a.y + a.h > b.y + 0.5;
}
// Rectangle inside the room along an opening, `depth` cm deep.
function openingZoneRect(o, depth) {
    switch (o.wall) {
        case 'north': return { x: o.offset, y: 0, w: o.width, h: depth };
        case 'south': return { x: o.offset, y: room.height - depth, w: o.width, h: depth };
        case 'west':  return { x: 0, y: o.offset, w: depth, h: o.width };
        default:      return { x: room.width - depth, y: o.offset, w: depth, h: o.width };
    }
}
function doorClearanceZone(o) { return openingZoneRect(o, o.swing === 'out' ? 60 : o.width); }
// Rectangle in front of an item (the side that faces "down" when rot = 0).
function frontZoneRect(it, depth) {
    switch (it.rot) {
        case 90:  return { x: it.x - depth, y: it.y, w: depth, h: it.W };
        case 180: return { x: it.x, y: it.y - depth, w: it.W, h: depth };
        case 270: return { x: it.x + it.D, y: it.y, w: depth, h: it.W };
        default:  return { x: it.x, y: it.y + it.D, w: it.W, h: depth };
    }
}
// Pointer position expressed relative to a wall: distance along it and distance into the room.
function wallLocal(wall, pt) {
    switch (wall) {
        case 'north': return { along: pt.x, inward: pt.y };
        case 'south': return { along: pt.x, inward: room.height - pt.y };
        case 'west':  return { along: pt.y, inward: pt.x };
        default:      return { along: pt.y, inward: room.width - pt.x };
    }
}

// ===== CANVAS / VIEW =====
const canvas = $('planCanvas');
const mainCtx = canvas.getContext('2d');
const wrapper = $('canvas-wrapper');
let ctx = mainCtx;
let scale = 1, ox = 0, oy = 0, viewW = 0, viewH = 0, dpr = 1;
let sceneBg = '#f8fafc';
let lastErgo = { issues: [], bad: new Set() };

const X = cm => ox + cm * scale;
const Y = cm => oy + cm * scale;

function maxOutExtent() {
    return openings.reduce((m, o) => (o.type === 'door' && o.swing === 'out') ? Math.max(m, o.width) : m, 0);
}
function computeFit(vw, vh, padTop, padSide, padBottom) {
    const ext = room.wallThickness + maxOutExtent();
    const s = Math.min((vw - 2 * padSide) / (room.width + 2 * ext), (vh - padTop - padBottom) / (room.height + 2 * ext));
    const sc = Math.max(0.05, s);
    return { scale: sc, ox: (vw - room.width * sc) / 2, oy: padTop + ((vh - padTop - padBottom) - room.height * sc) / 2 };
}

function resizeCanvas() {
    const r = wrapper.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    viewW = r.width; viewH = r.height;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    View3D.resize();
    draw();
}

function draw() {
    lastErgo = runErgonomics();
    renderErgo(lastErgo);
    if (viewMode === '3d') { View3D.markDirty(); updateToolbarCoords(); return; }
    if (viewW < 10 || viewH < 10) return;
    mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const toolbarSpace = sel ? 70 : 40;
    renderScene(mainCtx, viewW, viewH, { pads: [66, 50, toolbarSpace] });
    updateToolbarCoords();
}

function renderScene(c, vw, vh, opts) {
    ctx = c;
    sceneBg = opts.exporting ? '#ffffff' : '#f8fafc';
    const f = computeFit(vw, vh, opts.pads[0], opts.pads[1], opts.pads[2]);
    scale = f.scale; ox = f.ox; oy = f.oy;

    ctx.fillStyle = sceneBg;
    ctx.fillRect(0, 0, vw, vh);
    drawFloor();
    if (settings.showZones) drawOpeningZones();

    const selF = opts.exporting ? null : selectedFurniture();
    furniture.filter(it => it !== selF).forEach(it => drawItem(it, false));
    if (selF) drawItem(selF, true);

    drawWalls();
    openings.forEach(drawOpeningSymbol);
    drawWallSegmentLabels();
    openings.forEach(drawOpeningLabel);
    drawRoomDims();

    if (!opts.exporting) {
        if (selF && settings.showDistances) drawDistances(selF);
        const selO = selectedOpening();
        if (selO) drawOpeningHighlight(selO);
        drawMeasure();
    }
    ctx = mainCtx;
}

function rr(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawFloor() {
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(X(0), Y(0), room.width * scale, room.height * scale);
    const minor = scale * 10 >= 6 ? 10 : 50;
    const major = minor === 10 ? 50 : 100;
    for (let x = 0; x <= room.width; x += minor) {
        ctx.beginPath(); ctx.moveTo(X(x), Y(0)); ctx.lineTo(X(x), Y(room.height));
        ctx.strokeStyle = x % major === 0 ? '#e2e8f0' : '#f1f5f9'; ctx.lineWidth = x % major === 0 ? 1 : 0.6; ctx.stroke();
    }
    for (let y = 0; y <= room.height; y += minor) {
        ctx.beginPath(); ctx.moveTo(X(0), Y(y)); ctx.lineTo(X(room.width), Y(y));
        ctx.strokeStyle = y % major === 0 ? '#e2e8f0' : '#f1f5f9'; ctx.lineWidth = y % major === 0 ? 1 : 0.6; ctx.stroke();
    }
    ctx.restore();
}

function drawWalls() {
    const wt = room.wallThickness * scale, x0 = X(0), y0 = Y(0), W = room.width * scale, H = room.height * scale;
    ctx.save();
    ctx.fillStyle = '#334155';
    ctx.fillRect(x0 - wt, y0 - wt, W + 2 * wt, wt);
    ctx.fillRect(x0 - wt, y0 + H, W + 2 * wt, wt);
    ctx.fillRect(x0 - wt, y0, wt, H);
    ctx.fillRect(x0 + W, y0, wt, H);
    ctx.restore();
}

// Canvas transform mapping wall-local cm coords (along, inward) to screen pixels.
// Local y < 0 is inside the wall / outside the room.
function wallMatrix(wall) {
    const s = scale;
    switch (wall) {
        case 'north': return [s, 0, 0, s, ox, oy];
        case 'south': return [s, 0, 0, -s, ox, oy + room.height * s];
        case 'west':  return [0, s, s, 0, ox, oy];
        default:      return [0, s, -s, 0, ox + room.width * s, oy];
    }
}
function withWall(wall, fn) { ctx.save(); ctx.transform(...wallMatrix(wall)); fn(1 / scale); ctx.restore(); }

function drawOpeningZones() {
    openings.forEach(o => withWall(o.wall, p => {
        const off = o.offset, w = o.width;
        ctx.setLineDash([4 * p, 3 * p]);
        ctx.lineWidth = 1 * p;
        if (o.type === 'door') {
            if (o.swing === 'out') {
                ctx.fillStyle = 'rgba(244,63,94,0.05)'; ctx.strokeStyle = 'rgba(244,63,94,0.35)';
                ctx.fillRect(off, 0, w, 60); ctx.strokeRect(off, 0, w, 60);
            } else {
                const hx = o.swing === 'in-left' ? off : off + w;
                const [a0, a1] = o.swing === 'in-left' ? [0, Math.PI / 2] : [Math.PI / 2, Math.PI];
                ctx.fillStyle = 'rgba(244,63,94,0.08)'; ctx.strokeStyle = 'rgba(244,63,94,0.4)';
                ctx.beginPath(); ctx.moveTo(hx, 0); ctx.arc(hx, 0, w, a0, a1); ctx.closePath(); ctx.fill();
            }
        } else if (o.swingDepth > 0) {
            const d = o.swingDepth;
            ctx.fillStyle = 'rgba(14,165,233,0.06)'; ctx.strokeStyle = 'rgba(14,165,233,0.5)';
            ctx.fillRect(off, 0, w, d); ctx.strokeRect(off, 0, w, d);
            const r = Math.min(w / 2, d);
            ctx.beginPath(); ctx.arc(off, 0, r, 0, Math.PI / 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(off + w, 0, r, Math.PI / 2, Math.PI); ctx.stroke();
        }
    }));
}

function drawOpeningSymbol(o) {
    const wt = room.wallThickness;
    withWall(o.wall, p => {
        const off = o.offset, w = o.width;
        if (o.type === 'door') {
            ctx.fillStyle = sceneBg;
            ctx.fillRect(off, -wt, w, wt);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(off, -wt * 0.5 - 1 * p, w, 2 * p);
            ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 2 * p;
            let hx, hy, lx, ly, a0, a1;
            if (o.swing === 'out') { hx = off; hy = -wt; lx = off; ly = -wt - w; a0 = -Math.PI / 2; a1 = 0; }
            else if (o.swing === 'in-left') { hx = off; hy = 0; lx = off; ly = w; a0 = 0; a1 = Math.PI / 2; }
            else { hx = off + w; hy = 0; lx = off + w; ly = w; a0 = Math.PI / 2; a1 = Math.PI; }
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(lx, ly); ctx.stroke();
            ctx.lineWidth = 1.2 * p; ctx.setLineDash([4 * p, 3 * p]);
            ctx.beginPath(); ctx.arc(hx, hy, w, a0, a1); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#e11d48';
            ctx.beginPath(); ctx.arc(hx, hy, 2.5 * p, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = '#e0f2fe';
            ctx.fillRect(off, -wt, w, wt);
            ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 1.2 * p;
            ctx.strokeRect(off, -wt, w, wt);
            ctx.beginPath();
            ctx.moveTo(off, -wt * 0.4); ctx.lineTo(off + w, -wt * 0.4);
            ctx.moveTo(off, -wt * 0.6); ctx.lineTo(off + w, -wt * 0.6);
            ctx.stroke();
        }
    });
}

// Screen position for text just outside a wall, `gap` px beyond the outer face.
function outsideTextPos(wall, along, gap) {
    const wt = room.wallThickness * scale;
    switch (wall) {
        case 'north': return { x: X(along), y: Y(0) - wt - gap, rot: 0, base: 'bottom' };
        case 'south': return { x: X(along), y: Y(room.height) + wt + gap, rot: 0, base: 'top' };
        case 'west':  return { x: X(0) - wt - gap, y: Y(along), rot: -Math.PI / 2, base: 'bottom' };
        default:      return { x: X(room.width) + wt + gap, y: Y(along), rot: -Math.PI / 2, base: 'top' };
    }
}
function textAt(pos, text) {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    if (pos.rot) ctx.rotate(pos.rot);
    ctx.textAlign = 'center';
    ctx.textBaseline = pos.base;
    ctx.fillText(text, 0, 0);
    ctx.restore();
}

function drawOpeningLabel(o) {
    let text = `${o.type === 'door' ? t('door') : t('window')} ${toDisp(o.width)}`;
    if (o.type === 'window' && o.heightFromFloor !== null && o.heightFromFloor !== undefined) text += ` · ↑${toDisp(o.heightFromFloor)}`;
    const extra = (o.type === 'door' && o.swing === 'out') ? o.width * scale + 4 : 0;
    ctx.save();
    ctx.font = '600 10px "Inter", sans-serif';
    ctx.fillStyle = o.type === 'door' ? '#be123c' : '#0369a1';
    textAt(outsideTextPos(o.wall, o.offset + o.width / 2, 5 + extra), text);
    ctx.restore();
}

function drawWallSegmentLabels() {
    const wtPx = room.wallThickness * scale;
    if (wtPx < 10) return;
    ctx.save();
    ctx.font = `600 ${Math.min(10, Math.floor(wtPx * 0.7))}px "JetBrains Mono", monospace`;
    ctx.fillStyle = '#e2e8f0';
    WALLS.forEach(wall => {
        const ops = openings.filter(o => o.wall === wall).sort((a, b) => a.offset - b.offset);
        if (!ops.length) return;
        const len = wallLen(wall);
        let cur = 0;
        const segs = [];
        ops.forEach(o => { if (o.offset - cur > 0.5) segs.push([cur, o.offset]); cur = Math.max(cur, o.offset + o.width); });
        if (len - cur > 0.5) segs.push([cur, len]);
        segs.forEach(([a, b]) => {
            const label = shortLen(b - a);
            if ((b - a) * scale < ctx.measureText(label).width + 8) return;
            const pos = outsideTextPos(wall, (a + b) / 2, -wtPx / 2);
            pos.base = 'middle';
            textAt(pos, label);
        });
    });
    ctx.restore();
}

function drawRoomDims() {
    const wt = room.wallThickness * scale;
    ctx.save();
    ctx.strokeStyle = '#94a3b8'; ctx.fillStyle = '#475569'; ctx.lineWidth = 1;
    ctx.font = '600 11px "JetBrains Mono", monospace';
    // Width (top)
    const yl = Y(0) - wt - 26;
    ctx.beginPath();
    ctx.moveTo(X(0), yl); ctx.lineTo(X(room.width), yl);
    ctx.moveTo(X(0), yl - 4); ctx.lineTo(X(0), yl + 4);
    ctx.moveTo(X(room.width), yl - 4); ctx.lineTo(X(room.width), yl + 4);
    ctx.stroke();
    const wLabel = toDisp(room.width);
    const tw = ctx.measureText(wLabel).width + 8;
    ctx.fillStyle = sceneBg; ctx.fillRect(X(room.width / 2) - tw / 2, yl - 7, tw, 14);
    ctx.fillStyle = '#475569'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(wLabel, X(room.width / 2), yl);
    // Height (left)
    const xl = X(0) - wt - 26;
    ctx.beginPath();
    ctx.moveTo(xl, Y(0)); ctx.lineTo(xl, Y(room.height));
    ctx.moveTo(xl - 4, Y(0)); ctx.lineTo(xl + 4, Y(0));
    ctx.moveTo(xl - 4, Y(room.height)); ctx.lineTo(xl + 4, Y(room.height));
    ctx.stroke();
    const hLabel = toDisp(room.height);
    ctx.save();
    ctx.translate(xl, Y(room.height / 2)); ctx.rotate(-Math.PI / 2);
    const th = ctx.measureText(hLabel).width + 8;
    ctx.fillStyle = sceneBg; ctx.fillRect(-th / 2, -7, th, 14);
    ctx.fillStyle = '#475569'; ctx.fillText(hLabel, 0, 0);
    ctx.restore();
    // Room name
    if (room.name) {
        ctx.font = '700 13px "Inter", sans-serif';
        ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(room.name, X(room.width / 2), yl - 10);
    }
    ctx.restore();
}

// Canvas transform mapping item-local cm coords (u along width, v along depth; v = D is the front) to screen.
function itemMatrix(it) {
    const s = scale, x = it.x, y = it.y;
    switch (it.rot) {
        case 90:  return [0, s, -s, 0, ox + s * (x + it.D), oy + s * y];
        case 180: return [-s, 0, 0, -s, ox + s * (x + it.W), oy + s * (y + it.D)];
        case 270: return [0, -s, s, 0, ox + s * x, oy + s * (y + it.W)];
        default:  return [s, 0, 0, s, ox + s * x, oy + s * y];
    }
}

function drawItem(it, isSelected) {
    const W = it.W, D = it.D;
    const isBad = lastErgo.bad.has(it.id);
    ctx.save();
    ctx.transform(...itemMatrix(it));
    const p = 1 / scale;

    // Front zones
    if (it.chairDepth > 0) {
        const cd = it.chairDepth;
        ctx.fillStyle = 'rgba(16,185,129,0.08)'; ctx.strokeStyle = 'rgba(16,185,129,0.5)';
        ctx.setLineDash([4 * p, 3 * p]); ctx.lineWidth = p;
        ctx.fillRect(0, D, W, cd); ctx.strokeRect(0, D, W, cd);
        ctx.setLineDash([]);
        const cr = Math.max(4, Math.min(22, cd / 2 - 4, W / 2 - 4));
        ctx.fillStyle = '#a7f3d0'; ctx.strokeStyle = '#059669'; ctx.lineWidth = 1.2 * p;
        ctx.beginPath(); ctx.arc(W / 2, D + cd / 2, cr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    if (it.swingDepth > 0 && it.doorType === 'hinged' && settings.showZones) {
        const sd = it.swingDepth;
        ctx.fillStyle = 'rgba(217,119,6,0.07)'; ctx.strokeStyle = 'rgba(217,119,6,0.5)';
        ctx.setLineDash([4 * p, 3 * p]); ctx.lineWidth = p;
        ctx.fillRect(0, D, W, sd); ctx.strokeRect(0, D, W, sd);
        const n = Math.max(1, Math.round(W / 50)), lw = W / n, r = Math.min(lw, sd);
        for (let i = 0; i < n; i++) {
            ctx.beginPath();
            if (i % 2 === 0) ctx.arc(i * lw, D, r, 0, Math.PI / 2);
            else ctx.arc((i + 1) * lw, D, r, Math.PI / 2, Math.PI);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    }

    // Body
    ctx.fillStyle = it.fill;
    ctx.strokeStyle = isSelected ? '#1d4ed8' : (isBad ? '#e11d48' : it.stroke);
    ctx.lineWidth = (isSelected ? 2.5 : isBad ? 2 : 1.5) * p;
    if (it.dt === 'ldesk') {
        const a = Math.min(60, W / 2), b = Math.min(60, D / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, b); ctx.lineTo(a, b); ctx.lineTo(a, D); ctx.lineTo(0, D); ctx.closePath();
        ctx.fill(); ctx.stroke();
    } else if (it.dt === 'table' || it.dt === 'sofa' || it.dt === 'chair' || it.dt === 'bathtub') {
        rr(0, 0, W, D, Math.min(8, W / 6, D / 6)); ctx.fill(); ctx.stroke();
    } else {
        ctx.fillRect(0, 0, W, D); ctx.strokeRect(0, 0, W, D);
    }
    drawItemDetails(it, p);
    ctx.restore();
    drawItemLabel(it, isSelected);
}

function drawItemDetails(it, p) {
    const W = it.W, D = it.D;
    ctx.lineWidth = p;
    ctx.strokeStyle = it.stroke;
    switch (it.dt) {
        case 'bed': {
            ctx.fillStyle = it.stroke; ctx.globalAlpha = 0.35;
            ctx.fillRect(0, 0, W, Math.min(6, D * 0.05));
            ctx.globalAlpha = 1;
            const n = W >= 120 ? 2 : 1, m = Math.min(8, W * 0.06), pd = Math.min(32, D * 0.16);
            const pw = (W - m * (n + 1)) / n;
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < n; i++) { rr(m + i * (pw + m), m, pw, pd, 4); ctx.fill(); ctx.stroke(); }
            ctx.beginPath(); ctx.moveTo(0, D * 0.38); ctx.lineTo(W, D * 0.38); ctx.stroke();
            break;
        }
        case 'sofa': {
            const back = Math.min(20, D * 0.25), arm = Math.min(16, W * 0.12);
            ctx.fillStyle = it.stroke; ctx.globalAlpha = 0.3;
            rr(0, 0, W, back, 5); ctx.fill();
            rr(0, 0, arm, D, 5); ctx.fill();
            rr(W - arm, 0, arm, D, 5); ctx.fill();
            ctx.globalAlpha = 1;
            const n = Math.max(1, Math.round((W - 2 * arm) / 60)), cw = (W - 2 * arm) / n;
            ctx.beginPath();
            for (let i = 1; i < n; i++) { ctx.moveTo(arm + i * cw, back); ctx.lineTo(arm + i * cw, D - 4); }
            ctx.stroke();
            break;
        }
        case 'desk':
            ctx.fillStyle = '#334155';
            ctx.fillRect(W * 0.3, Math.min(6, D * 0.1), W * 0.4, Math.max(2, D * 0.05));
            break;
        case 'wardrobe': case 'cabinet': {
            const n = Math.max(1, Math.round(W / 50)), lw = W / n;
            ctx.beginPath();
            for (let i = 1; i < n; i++) { ctx.moveTo(i * lw, 0); ctx.lineTo(i * lw, D); }
            ctx.moveTo(0, D - 3); ctx.lineTo(W, D - 3);
            ctx.stroke();
            if (it.dt === 'wardrobe') {
                ctx.setLineDash([3 * p, 3 * p]);
                ctx.beginPath(); ctx.moveTo(4, D / 2); ctx.lineTo(W - 4, D / 2); ctx.stroke();
                ctx.setLineDash([]);
            }
            break;
        }
        case 'table':
            rr(4, 4, W - 8, D - 8, 5); ctx.stroke();
            break;
        case 'chair':
            ctx.fillStyle = it.stroke; ctx.globalAlpha = 0.35;
            rr(0, 0, W, Math.min(10, D * 0.22), 4); ctx.fill();
            ctx.globalAlpha = 1;
            break;
        case 'tv':
            ctx.fillStyle = '#334155';
            ctx.fillRect(W * 0.15, Math.min(4, D * 0.08), W * 0.7, Math.max(2, D * 0.08));
            break;
        case 'shelf': {
            const n = Math.max(1, Math.round(W / 40));
            ctx.beginPath();
            for (let i = 1; i < n; i++) { ctx.moveTo(i * W / n, 0); ctx.lineTo(i * W / n, D); }
            ctx.stroke();
            break;
        }
        case 'fridge':
            ctx.beginPath(); ctx.moveTo(0, D - 5); ctx.lineTo(W, D - 5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(W * 0.2, D - 5); ctx.lineTo(W * 0.8, D * 0.2); ctx.stroke();
            break;
        case 'bathtub':
            ctx.fillStyle = '#ffffff';
            rr(7, 7, W - 14, D - 14, Math.min(25, D / 2 - 7)); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(W - 22, D / 2, 3, 0, Math.PI * 2); ctx.stroke();
            break;
        case 'shower':
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, D); ctx.moveTo(W, 0); ctx.lineTo(0, D); ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(W / 2, D / 2, Math.min(5, W / 8), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            break;
        case 'toilet':
            ctx.fillStyle = '#ffffff';
            rr(W * 0.08, 2, W * 0.84, D * 0.26, 3); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(W / 2, D * 0.63, W * 0.4, D * 0.32, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            break;
        case 'sink':
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.ellipse(W / 2, D * 0.55, W * 0.36, D * 0.32, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(W / 2, D * 0.12, 2, 0, Math.PI * 2); ctx.stroke();
            break;
        case 'washer':
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(W / 2, D / 2, Math.min(W, D) * 0.33, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            break;
    }
}

function fitText(text, maxW, size, minSize, weight, family) {
    let s = size;
    ctx.font = `${weight} ${s}px ${family}`;
    while (ctx.measureText(text).width > maxW && s > minSize) { s -= 1; ctx.font = `${weight} ${s}px ${family}`; }
    if (ctx.measureText(text).width <= maxW) return { text, size: s };
    let tx = text;
    while (tx.length > 1 && ctx.measureText(tx + '…').width > maxW) tx = tx.slice(0, -1);
    return { text: tx.length > 1 ? tx + '…' : '', size: s };
}

function drawItemLabel(it, isSelected) {
    const r = getItemRect(it);
    const px = X(r.x), py = Y(r.y), pw = r.w * scale, ph = r.h * scale;
    const vertical = pw < ph && pw < 70;
    const maxW = (vertical ? ph : pw) - 8;
    const maxH = (vertical ? pw : ph) - 4;
    if (maxW < 12 || maxH < 8) return;
    ctx.save();
    ctx.translate(px + pw / 2, py + ph / 2);
    if (vertical) ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const name = fitText(itemName(it), maxW, 11, 8, 600, '"Inter", sans-serif');
    const dims = `${shortLen(it.W)}×${shortLen(it.D)} · h${shortLen(it.H)}`;
    const two = maxH >= 24;
    const dimFit = two ? fitText(dims, maxW, 10, 8, 500, '"JetBrains Mono", monospace') : null;
    const showDims = two && dimFit && dimFit.text === dims;
    ctx.fillStyle = isSelected ? '#1e3a8a' : '#1e293b';
    ctx.font = `600 ${name.size}px "Inter", sans-serif`;
    ctx.fillText(name.text, 0, showDims ? -6 : 0);
    if (showDims) {
        ctx.font = `500 ${dimFit.size}px "JetBrains Mono", monospace`;
        ctx.fillStyle = '#475569';
        ctx.fillText(dims, 0, 7);
    }
    ctx.restore();
}

function pillLabel(text, x, y) {
    ctx.font = '600 10px "JetBrains Mono", monospace';
    const w = ctx.measureText(text).width + 8;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    rr(x - w / 2, y - 8, w, 16, 4); ctx.fill();
    ctx.fillStyle = '#1d4ed8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
}

function drawDistances(it) {
    const r = getItemRect(it);
    const px = X(r.x), py = Y(r.y), pw = r.w * scale, ph = r.h * scale;
    const midX = px + pw / 2, midY = py + ph / 2;
    const gaps = [
        { d: r.x, line: [X(0), midY, px, midY] },
        { d: room.width - r.x - r.w, line: [px + pw, midY, X(room.width), midY] },
        { d: r.y, line: [midX, Y(0), midX, py] },
        { d: room.height - r.y - r.h, line: [midX, py + ph, midX, Y(room.height)] },
    ];
    ctx.save();
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    gaps.forEach(g => {
        if (g.d < 0.5) return;
        const [a, b, c, d] = g.line;
        ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
    });
    ctx.setLineDash([]);
    gaps.forEach(g => {
        if (g.d < 0.5) return;
        const [a, b, c, d] = g.line;
        if (Math.hypot(c - a, d - b) < 18) return;
        pillLabel(toDisp(g.d), (a + c) / 2, (b + d) / 2);
    });
    ctx.restore();
}

function drawOpeningHighlight(o) {
    const wt = room.wallThickness, len = wallLen(o.wall);
    withWall(o.wall, p => {
        ctx.strokeStyle = 'rgba(245,158,11,0.45)'; ctx.lineWidth = 4 * p;
        ctx.beginPath(); ctx.moveTo(0, 1.5 * p); ctx.lineTo(len, 1.5 * p); ctx.stroke();
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5 * p;
        ctx.strokeRect(o.offset, -wt, o.width, wt);
        const ay = -wt / 2, a = 9 * p, g = 5 * p;
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(o.offset - g - a, ay); ctx.lineTo(o.offset - g, ay - a * 0.6); ctx.lineTo(o.offset - g, ay + a * 0.6); ctx.closePath();
        ctx.moveTo(o.offset + o.width + g + a, ay); ctx.lineTo(o.offset + o.width + g, ay - a * 0.6); ctx.lineTo(o.offset + o.width + g, ay + a * 0.6); ctx.closePath();
        ctx.fill();
    });
    // Distances from wall ends
    const wallStartLabel = toDisp(o.offset), wallEndLabel = toDisp(wallLen(o.wall) - o.offset - o.width);
    ctx.save();
    const inPos = along => {
        const d = 12 / scale;
        const pt = o.wall === 'north' ? [along, d] : o.wall === 'south' ? [along, room.height - d] : o.wall === 'west' ? [d, along] : [room.width - d, along];
        return [X(pt[0]), Y(pt[1])];
    };
    if (o.offset * scale > 40) { const [x, y] = inPos(o.offset / 2); pillLabel(wallStartLabel, x, y); }
    const rest = wallLen(o.wall) - o.offset - o.width;
    if (rest * scale > 40) { const [x, y] = inPos(o.offset + o.width + rest / 2); pillLabel(wallEndLabel, x, y); }
    ctx.restore();
}

// ===== ERGONOMICS =====
function runErgonomics() {
    const issues = [];
    const bad = new Set();
    const rects = furniture.map(f => ({ f, r: getItemRect(f) }));
    const counts = { overlap: 0, outside: 0, door: 0, window: 0, swing: 0, opening: 0 };

    for (let i = 0; i < rects.length; i++)
        for (let j = i + 1; j < rects.length; j++)
            if (rectsOverlap(rects[i].r, rects[j].r)) {
                issues.push({ type: 'error', text: t('overlap', itemName(rects[i].f), itemName(rects[j].f)) });
                bad.add(rects[i].f.id); bad.add(rects[j].f.id); counts.overlap++;
            }

    rects.forEach(({ f, r }) => {
        if (r.x < -0.5 || r.y < -0.5 || r.x + r.w > room.width + 0.5 || r.y + r.h > room.height + 0.5) {
            issues.push({ type: 'error', text: t('outsideRoom', itemName(f)) }); bad.add(f.id); counts.outside++;
        }
    });

    openings.forEach(o => {
        if (o.type === 'door') {
            const zone = doorClearanceZone(o);
            rects.forEach(({ f, r }) => { if (rectsOverlap(r, zone)) { issues.push({ type: 'warning', text: t('blocksDoor', itemName(f)) }); counts.door++; } });
        } else if (o.swingDepth > 0) {
            const zone = openingZoneRect(o, o.swingDepth);
            rects.forEach(({ f, r }) => { if (rectsOverlap(r, zone)) { issues.push({ type: 'warning', text: t('inWindowZone', itemName(f)) }); counts.window++; } });
        }
    });

    rects.forEach(({ f }) => {
        if (!(f.swingDepth > 0 && f.doorType === 'hinged')) return;
        const zone = frontZoneRect(f, f.swingDepth);
        rects.forEach(({ f: g, r }) => {
            if (g !== f && rectsOverlap(r, zone)) { issues.push({ type: 'warning', text: t('swingBlocked', itemName(f), itemName(g)) }); counts.swing++; }
        });
    });

    WALLS.forEach(wall => {
        const ops = openings.filter(o => o.wall === wall).sort((a, b) => a.offset - b.offset);
        const len = wallLen(wall);
        if (ops.some(o => o.offset + o.width > len + 0.5)) { issues.push({ type: 'error', text: t('openingTooBig', t(wall)) }); counts.opening++; }
        for (let i = 1; i < ops.length; i++)
            if (ops[i].offset < ops[i - 1].offset + ops[i - 1].width - 0.5) { issues.push({ type: 'error', text: t('openingsOverlap', t(wall)) }); counts.opening++; break; }
    });

    return { issues, bad, counts };
}

let lastErgoHtml = '';
function renderErgo(res) {
    const errors = res.issues.filter(i => i.type === 'error').length;
    const warnings = res.issues.length - errors;
    const oks = [];
    if (!res.counts.overlap) oks.push(t('okNoOverlaps'));
    if (!res.counts.outside) oks.push(t('okInside'));
    if (!res.counts.door && openings.some(o => o.type === 'door')) oks.push(t('okDoors'));
    if (!res.counts.window && openings.some(o => o.type === 'window' && o.swingDepth > 0)) oks.push(t('okWindows'));
    if (!res.counts.swing && furniture.some(f => f.swingDepth > 0 && f.doorType === 'hinged')) oks.push(t('okSwing'));
    if (!res.counts.opening && openings.length) oks.push(t('okOpenings'));
    const html = res.issues.map(i => `<div class="ergo ${i.type}"><span class="font-bold">${i.type === 'error' ? '✕' : '⚠'}</span><span>${esc(i.text)}</span></div>`).join('')
        + oks.map(s => `<div class="ergo ok"><span class="font-bold">✓</span><span>${esc(s)}</span></div>`).join('');
    const badge = errors ? ['bg-rose-100 text-rose-800', t('statusErr', errors)]
        : warnings ? ['bg-amber-100 text-amber-800', t('statusWarn', warnings)]
        : ['bg-emerald-100 text-emerald-800', t('statusOk')];
    const full = html + '|' + badge.join('|');
    if (full === lastErgoHtml) return;
    lastErgoHtml = full;
    $('ergo-list').innerHTML = html;
    const b = $('ergo-badge');
    b.className = 'px-2 py-0.5 text-[11px] font-semibold rounded-full ' + badge[0];
    b.textContent = badge[1];
}

// ===== INTERACTION =====
function eventCm(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}
function hitFurniture(pt) {
    const selF = selectedFurniture();
    const order = selF ? [selF, ...furniture.filter(f => f !== selF).reverse()] : [...furniture].reverse();
    return order.find(f => { const r = getItemRect(f); return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h; });
}
function hitOpening(pt) {
    const tol = 6 / scale;
    const wt = room.wallThickness;
    return openings.find(o => {
        const l = wallLocal(o.wall, pt);
        return l.along >= o.offset - tol && l.along <= o.offset + o.width + tol && l.inward >= -wt - tol && l.inward <= Math.max(tol, 8);
    });
}

function select(next) {
    const changed = JSON.stringify(sel) !== JSON.stringify(next);
    sel = next;
    if (changed) { renderToolbar(); renderFurnitureList(); renderOpeningsList(); }
}

canvas.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    const pt = eventCm(e);
    if (measure.active) {
        measure.a = measureSnap(pt, null, false);
        measure.b = measure.a;
        measure.dragging = true;
        canvas.setPointerCapture(e.pointerId);
        e.preventDefault();
        draw();
        return;
    }
    const f = hitFurniture(pt);
    if (f) {
        select({ kind: 'furniture', id: f.id });
        drag = { mode: 'furniture', id: f.id, dx: pt.x - f.x, dy: pt.y - f.y, moved: false };
    } else {
        const o = hitOpening(pt);
        if (o) {
            select({ kind: 'opening', id: o.id });
            drag = { mode: 'opening', id: o.id, grab: wallLocal(o.wall, pt).along - o.offset, moved: false };
        } else {
            select(null);
        }
    }
    if (drag) { canvas.setPointerCapture(e.pointerId); e.preventDefault(); }
    updateCursor(pt);
    draw();
});

canvas.addEventListener('pointermove', e => {
    const pt = eventCm(e);
    if (measure.active) {
        canvas.style.cursor = 'crosshair';
        if (measure.dragging) { e.preventDefault(); measure.b = measureSnap(pt, measure.a, e.shiftKey); draw(); }
        return;
    }
    if (!drag) { updateCursor(pt); return; }
    e.preventDefault();
    if (drag.mode === 'furniture') moveFurnitureTo(pt);
    else moveOpeningTo(pt);
    drag.moved = true;
    draw();
});

function endDrag() {
    measure.dragging = false;
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    if (moved) { markDirty(); renderOpeningsList(); renderToolbar(); }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { if (!drag) canvas.style.cursor = 'default'; });

// ===== MEASURE TOOL =====
const measure = { active: false, a: null, b: null, dragging: false };

// Snaps each axis to nearby walls, furniture edges and door/window edges; otherwise to whole cm.
function measureSnap(pt, anchor, straight) {
    let x = pt.x, y = pt.y;
    let lockX = false, lockY = false;
    if (straight && anchor) {
        if (Math.abs(x - anchor.x) > Math.abs(y - anchor.y)) { y = anchor.y; lockY = true; }
        else { x = anchor.x; lockX = true; }
    }
    const xs = [0, room.width], ys = [0, room.height];
    furniture.forEach(f => { const r = getItemRect(f); xs.push(r.x, r.x + r.w); ys.push(r.y, r.y + r.h); });
    openings.forEach(o => { (isHorizontal(o.wall) ? xs : ys).push(o.offset, o.offset + o.width); });
    const tol = 8 / scale;
    const nearest = (v, list) => {
        let best = null, bd = tol;
        list.forEach(c => { const d = Math.abs(v - c); if (d < bd) { bd = d; best = c; } });
        return best;
    };
    const sx = lockX ? x : nearest(x, xs), sy = lockY ? y : nearest(y, ys);
    return { x: sx !== null ? sx : Math.round(x), y: sy !== null ? sy : Math.round(y) };
}

function toggleMeasure(force) {
    measure.active = typeof force === 'boolean' ? force : !measure.active;
    if (measure.active) { if (viewMode === '3d') setView('2d'); select(null); }
    else { measure.a = measure.b = null; measure.dragging = false; canvas.style.cursor = 'default'; }
    $('measure-btn').className = 'btn ' + (measure.active ? 'btn-primary' : 'btn-secondary');
    $('measure-hint').classList.toggle('hidden', !measure.active);
    draw();
}

function drawMeasure() {
    const { a, b } = measure;
    if (!a || !b) return;
    const ax = X(a.x), ay = Y(a.y), bx = X(b.x), by = Y(b.y);
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    ctx.save();
    ctx.strokeStyle = '#0f172a'; ctx.fillStyle = '#0f172a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    const ang = Math.atan2(by - ay, bx - ax), nx = -Math.sin(ang) * 7, ny = Math.cos(ang) * 7;
    [[ax, ay], [bx, by]].forEach(([x, y]) => {
        ctx.beginPath(); ctx.moveTo(x - nx, y - ny); ctx.lineTo(x + nx, y + ny); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    });
    if (len >= 1) {
        const dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
        let text = toDisp(len);
        if (dx >= 1 && dy >= 1) text += `  (↔ ${toDisp(dx)} · ↕ ${toDisp(dy)})`;
        ctx.font = '600 12px "JetBrains Mono", monospace';
        const w = ctx.measureText(text).width + 12;
        const mx = (ax + bx) / 2, my = (ay + by) / 2 - 16;
        ctx.fillStyle = '#0f172a';
        rr(mx - w / 2, my - 10, w, 20, 5); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, mx, my);
    }
    ctx.restore();
}

function updateCursor(pt) {
    if (drag) {
        if (drag.mode === 'furniture') canvas.style.cursor = 'grabbing';
        else { const o = selectedOpening(); canvas.style.cursor = o && isHorizontal(o.wall) ? 'ew-resize' : 'ns-resize'; }
        return;
    }
    if (hitFurniture(pt)) canvas.style.cursor = 'grab';
    else { const o = hitOpening(pt); canvas.style.cursor = o ? (isHorizontal(o.wall) ? 'ew-resize' : 'ns-resize') : 'default'; }
}

function snapAxis(raw, size, max, edges) {
    const candidates = [0, max - size];
    edges.forEach(([a, b]) => candidates.push(a, b, a - size, b - size));
    let best = null, bestD = 6;
    candidates.forEach(c => { const d = Math.abs(raw - c); if (d < bestD) { bestD = d; best = c; } });
    return best !== null ? best : Math.round(raw / 5) * 5;
}

function moveFurnitureTo(pt) {
    const it = furniture.find(f => f.id === drag.id);
    if (!it) return;
    const r = getItemRect(it);
    let nx = pt.x - drag.dx, ny = pt.y - drag.dy;
    if (settings.snap) {
        const others = furniture.filter(f => f !== it).map(getItemRect);
        nx = snapAxis(nx, r.w, room.width, others.map(o => [o.x, o.x + o.w]));
        ny = snapAxis(ny, r.h, room.height, others.map(o => [o.y, o.y + o.h]));
    }
    it.x = clamp(nx, 0, Math.max(0, room.width - r.w));
    it.y = clamp(ny, 0, Math.max(0, room.height - r.h));
}

function moveOpeningTo(pt) {
    const o = openings.find(x => x.id === drag.id);
    if (!o) return;
    let along = wallLocal(o.wall, pt).along;
    const len = wallLen(o.wall);
    const CORNER = 20;
    if (along < -CORNER || along > len + CORNER) {
        const prevWall = o.wall;
        o.wall = WALL_ADJ[o.wall][along < 0 ? 0 : 1];
        drag.grab = o.width / 2;
        along = wallLocal(o.wall, pt).along;
        if (o.width > wallLen(o.wall)) o.width = wallLen(o.wall);
        if (prevWall !== o.wall) renderToolbar();
    }
    let off = along - drag.grab;
    if (settings.snap) off = Math.round(off / 5) * 5;
    o.offset = clamp(off, 0, Math.max(0, wallLen(o.wall) - o.width));
}

// ===== KEYBOARD =====
window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.code === 'KeyS') { e.preventDefault(); saveToBrowser(); return; }
    if (mod && e.code === 'KeyE') { e.preventDefault(); exportJSON(); return; }
    const openModal = ['setup-modal', 'catalog-modal', 'custom-modal'].find(id => !$(id).classList.contains('hidden'));
    if (openModal) {
        if (e.key === 'Escape') { $(openModal).classList.add('hidden'); }
        return;
    }
    if (typing || mod || e.altKey) return;
    switch (e.code) {
        case 'KeyR': rotateSelected(); break;
        case 'KeyD': duplicateSelected(); break;
        case 'Delete': case 'Backspace': if (sel) { e.preventDefault(); deleteSelected(); } break;
        case 'Escape': if (measure.active) toggleMeasure(false); else { select(null); draw(); } break;
        case 'KeyM': toggleMeasure(); break;
        case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown':
            if (!sel) return;
            e.preventDefault();
            nudge(e.code, e.shiftKey ? 5 : 1);
            break;
    }
});

function nudge(code, step) {
    const f = selectedFurniture();
    if (f) {
        const r = getItemRect(f);
        if (code === 'ArrowLeft') f.x -= step;
        if (code === 'ArrowRight') f.x += step;
        if (code === 'ArrowUp') f.y -= step;
        if (code === 'ArrowDown') f.y += step;
        f.x = clamp(f.x, 0, Math.max(0, room.width - r.w));
        f.y = clamp(f.y, 0, Math.max(0, room.height - r.h));
    }
    const o = selectedOpening();
    if (o) {
        const dir = (code === 'ArrowLeft' || code === 'ArrowUp') ? -1 : 1;
        o.offset = clamp(o.offset + dir * step, 0, Math.max(0, wallLen(o.wall) - o.width));
        renderOpeningsList();
    }
    markDirty();
    draw();
}

// ===== ACTIONS =====
function rotateSelected() {
    const f = selectedFurniture();
    if (!f) return;
    const r0 = getItemRect(f);
    const cx = f.x + r0.w / 2, cy = f.y + r0.h / 2;
    f.rot = (f.rot + 90) % 360;
    const r1 = getItemRect(f);
    f.x = Math.round(cx - r1.w / 2); f.y = Math.round(cy - r1.h / 2);
    clampItem(f);
    markDirty(); draw();
}

function duplicateSelected() {
    const f = selectedFurniture();
    if (!f) return;
    const copy = { ...f, id: newId('f'), x: f.x + 20, y: f.y + 20 };
    clampItem(copy);
    furniture.push(copy);
    select({ kind: 'furniture', id: copy.id });
    renderFurnitureList(); markDirty(); draw();
}

function deleteSelected() {
    if (!sel) return;
    if (sel.kind === 'furniture') furniture = furniture.filter(f => f.id !== sel.id);
    else openings = openings.filter(o => o.id !== sel.id);
    select(null);
    renderFurnitureList(); renderOpeningsList(); markDirty(); draw();
}

function deleteFurniture(id) {
    furniture = furniture.filter(f => f.id !== id);
    if (sel && sel.id === id) select(null);
    renderFurnitureList(); markDirty(); draw();
}
function deleteOpening(id) {
    openings = openings.filter(o => o.id !== id);
    if (sel && sel.id === id) select(null);
    renderOpeningsList(); markDirty(); draw();
}

function findFreeSpot(it) {
    const r = getItemRect(it);
    const blockers = furniture.map(getItemRect)
        .concat(furniture.filter(f => f.swingDepth > 0 && f.doorType === 'hinged').map(f => frontZoneRect(f, f.swingDepth)))
        .concat(furniture.filter(f => f.chairDepth > 0).map(f => frontZoneRect(f, f.chairDepth)))
        .concat(openings.map(o => o.type === 'door' ? doorClearanceZone(o) : openingZoneRect(o, o.swingDepth || 0)));
    for (let y = 0; y <= room.height - r.h; y += 10)
        for (let x = 0; x <= room.width - r.w; x += 10) {
            const cand = { x, y, w: r.w, h: r.h };
            if (!blockers.some(b => b.w > 0 && b.h > 0 && rectsOverlap(cand, b))) return { x, y };
        }
    return { x: Math.max(0, (room.width - r.w) / 2), y: Math.max(0, (room.height - r.h) / 2) };
}

function addItemFromDef(def) {
    const it = makeItem(def, 0, 0, 0);
    const spot = findFreeSpot(it);
    it.x = Math.round(spot.x); it.y = Math.round(spot.y);
    furniture.push(it);
    select({ kind: 'furniture', id: it.id });
    renderFurnitureList(); markDirty(); draw();
}
function addFromCatalog(id) {
    const def = CATALOG.find(c => c.id === id) || customCatalog.find(c => c.id === id);
    if (!def) return;
    hideCatalog();
    addItemFromDef(def);
}

function setItemDim(key, value) {
    const f = selectedFurniture();
    if (!f) return;
    const cm = inputToCm(value);
    if (!(cm >= 1)) { renderToolbar(); return; }
    f[key] = clamp(Math.round(cm * 10) / 10, 1, 3000);
    if (key !== 'H') clampItem(f);
    renderFurnitureList(); markDirty(); draw();
}
function setItemName(value) {
    const f = selectedFurniture();

    const v = String(value).trim().slice(0, 60);
    f.name = v && v !== (f.catalogId ? catalogName(f.catalogId) : '') ? v : (f.custom ? (v || f.name) : null);

function setOpeningProp(key, value) {
    const o = selectedOpening();
    if (!o) return;
    if (key === 'swing') o.swing = value;
    else if (key === 'wall') { if (WALLS.includes(value)) o.wall = value; }
    else if (key === 'heightFromFloor') {
        const cm = inputToCm(value);
        o.heightFromFloor = (value === '' || !isFinite(cm)) ? null : clamp(cm, 0, 1000);
    } else {
        const cm = inputToCm(value);
        if (isFinite(cm) && cm >= 0) {
            if (key === 'width') o.width = clamp(cm, 10, wallLen(o.wall));
            if (key === 'height') o.height = clamp(cm, 10, 1000);
            if (key === 'swingDepth') o.swingDepth = clamp(cm, 0, 500);
        }

    clampOpening(o);
    renderToolbar(); renderOpeningsList(); markDirty(); draw();
}

let openingFormType = 'door';
function showOpeningForm(type) {
    openingFormType = type;

    $('op-wall').innerHTML = wallOptions(isDoor ? 'south' : 'north');
    $('op-swing').innerHTML = swingOptions('in-left');

    $('op-height').value = cmToInput(isDoor ? 210 : 140);

    $('op-depth').value = cmToInput(50);

    $('opening-form').classList.remove('hidden');

function hideOpeningForm() { $('opening-form').classList.add('hidden'); }

function addOpening() {
    const wall = $('op-wall').value;
    const len = wallLen(wall);
    const width = inputToCm($('op-width').value);
    const height = inputToCm($('op-height').value);
    if (!(width >= 10) || !(height >= 10)) { toast(t('invalidSize')); return; }
    const o = normalizeOpening({
        type: openingFormType, wall,
        width: Math.min(width, len), height,
        swing: $('op-swing').value,
        swingDepth: inputToCm($('op-depth').value) || 0,
        heightFromFloor: $('op-floor').value === '' ? null : inputToCm($('op-floor').value),
    });
    // Find a free slot on the wall, starting from the middle and moving outwards.
    const others = openings.filter(x => x.wall === wall);
    const center = Math.max(0, (len - o.width) / 2);
    const fits = off => !others.some(x => off < x.offset + x.width && off + o.width > x.offset);
    o.offset = Math.round(center / 5) * 5;
    for (let d = 0; d <= len; d += 5) {
        if (center - d >= 0 && fits(Math.round((center - d) / 5) * 5)) { o.offset = Math.round((center - d) / 5) * 5; break; }
        if (center + d + o.width <= len && fits(Math.round((center + d) / 5) * 5)) { o.offset = Math.round((center + d) / 5) * 5; break; }
    }
    clampOpening(o);
    openings.push(o);
    hideOpeningForm();
    select({ kind: 'opening', id: o.id });
    renderOpeningsList(); markDirty(); draw();
}
